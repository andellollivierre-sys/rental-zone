name: PR checks

on:
  pull_request:
    branches:
      - fix/visitor-page-hash-tracking
  push:
    branches:
      - fix/secure-discord-tracking-rate-limit

permissions:
  contents: read

jobs:
  install-build-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
